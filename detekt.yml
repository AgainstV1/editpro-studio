# Detekt configuration for EditPro Studio
# Run with: ./gradlew detekt
# Auto-fix with: ./gradlew detekt --auto-correct

build:
  maxIssues: 0
  weights:
    complexity: 2
    style: 1
    comments: 1

config:
  validation: true
  warnsAsErrors: true

formatting:
  MaximumLineLength:
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
  TrailingWhitespace:
    active: true
  Indentation:
    active: true
    indentSize: 4
  NoMultipleSpaces:
    active: true

style:
  WildcardImport:
    active: true
    excludes: ['androidx.compose.ui.platform.*', 'kotlinx.coroutines.*']
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
    allowedNames: ['_', 'on.*', 'set.*']
  MagicNumber:
    active: true
    ignoreNumbers: [-1, 0, 1, 2, 3, 4, 5, 10, 100, 1000]
    ignoreConstantDeclaration: true
    ignorePropertyDeclaration: true
  TooManyFunctions:
    active: true
    thresholdInFiles: 50
    thresholdInClasses: 30
    thresholdInInterfaces: 20
    thresholdInObjects: 30
  TooManyProperties:
    active: true
    thresholdInClasses: 30
  FunctionParameterCount:
    active: true
    threshold: 6
    ignoreDefaultParameters: true
  NestedBlockDepth:
    active: true
    threshold: 4
  ReturnCount:
    active: true
    max: 6
  MaxChainedCallsOnSameLine:
    active: true
    maxChainedCalls: 5

complexity:
  ComplexMethod:
    active: true
    threshold: 15
    ignoreSimpleWhenEntries: true
    ignoreSingleWhenExpression: true
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    threshold: 6
    ignoreDefaultParameters: true
  NestedBlockDepth:
    active: true
    threshold: 4
  TooManyFunctions:
    active: true
    thresholdInFiles: 50
    thresholdInClasses: 30
    thresholdInInterfaces: 20
    thresholdInObjects: 30

naming:
  FunctionNaming:
    active: true
    functionPattern: '^[a-z][a-zA-Z0-9]*$'
  ClassNaming:
    active: true
    classPattern: '^[A-Z][a-zA-Z0-9]*$'
  VariableNaming:
    active: true
    variablePattern: '^[a-z][a-zA-Z0-9]*$'
    privateVariablePattern: '^[a-z][a-zA-Z0-9]*$'
  MemberNameEqualsClassName:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: true
  ExceptionRaisedInUnexpectedLocation:
    active: true
  SwallowedException:
    active: true
    ignoredExceptionTypes: ['CancellationException']

comments:
  UndocumentedPublicClass:
    active: false  # Too many public classes in Android/Compose projects
  UndocumentedPublicFunction:
    active: false

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  UnusedPrivateProperty:
    active: true

# Exclude generated code and test resources
excludes:
  - '**/build/**'
  - '**/generated/**'
  - '**/test/**'
  - '**/androidTest/**'